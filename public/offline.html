<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Parquet UI offline</title>
    <style>
      :root {
        color: #09090b;
        background: #ffffff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 560px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.06), 0 8px 24px rgb(15 23 42 / 0.05);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #52525b;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Parquet UI esta offline</h1>
      <p>
        Se voce ja acessou o app antes, a SPA deve abrir pelo cache do navegador. Recarregue a pagina quando a conexao
        voltar. Seus arquivos Parquet continuam sendo lidos apenas localmente.
      </p>
    </main>
  </body>
</html>
